id: valid-pre-verify
title: pre_verify frame before the approving frame
description: >
  A DEFAULT-mode pre_verify frame whose target is the approving frame's target.
  PREFIX-110 requires that target to have deployed code, so this needs a wallet
  contract as sender; with a plain EOA it is not a valid transaction.
tags: [valid, pre-verify, needs-deployed-contract]
exercises: [PREFIX-010, PREFIX-120]
frames:
  - role: pre_verify
    mode: DEFAULT
    target: sender
    limits: { execution: 20000 }
  - role: self_verify
    mode: VERIFY
    target: sender
    limits: { execution: 30000 }
expect:
  verdict: accept
