id: invalid-stray-default-frame
title: DEFAULT-mode frame that is neither deploy nor pre_verify
description: >
  HYPOTHESIS. On the wire a leading DEFAULT frame followed by a VERIFY frame is
  indistinguishable from [deploy, self_verify], so the node's shape check accepts it.
  Whether it is rejected later (PREFIX-020: a deploy frame must deploy tx.sender) can
  only be seen from a funded run, since default-code targets may skip simulation.
tags: [invalid, structure]
exercises: [PREFIX-010, PREFIX-120]
frames:
  - role: execution
    mode: DEFAULT
    target: "0x8943545177806ED17B9F23F0a21ee5948eCaa776"
    limits: { execution: 5000 }
  - role: self_verify
    mode: VERIFY
    target: sender
    limits: { execution: 30000 }
expect:
  verdict: reject
  ruleIds: [PREFIX-010, PREFIX-120]
