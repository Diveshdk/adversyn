id: valid-only-verify-pay
title: only_verify then pay (sponsored shape)
description: >
  Sender approves execution, a separate payer approves payment. The payer must be a
  deployed paymaster contract; 0x2222... is a placeholder, so this is skipped until
  Adversyn can deploy or locate one.
tags: [valid, sponsored, needs-deployed-contract]
exercises: [PREFIX-010, BUDGET-010]
frames:
  - role: only_verify
    mode: VERIFY
    target: sender
    limits: { execution: 30000 }
  - role: pay
    mode: VERIFY
    target: "0x2222222222222222222222222222222222222222"
    limits: { execution: 50000 }
  - role: execution
    mode: SENDER
    target: "0x8943545177806ED17B9F23F0a21ee5948eCaa776"
    limits: { execution: 50000 }
expect:
  verdict: accept
