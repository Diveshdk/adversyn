id: invalid-expired-expiry
title: expiry_verify deadline in the past
description: >
  Deadline 1 (1970) is always earlier than block time. The target is a placeholder;
  the protocol package must supply the real expiry verifier address.
tags: [invalid, expiry]
exercises: [PREFIX-080]
frames:
  - role: expiry_verify
    mode: VERIFY
    target: "0x0000000000000000000000000000000000000000"
    limits: { execution: 5000 }
    extra: { deadline: 1 }
  - role: self_verify
    mode: VERIFY
    target: sender
    limits: { execution: 30000 }
expect:
  verdict: reject
  ruleIds: [PREFIX-080]
