id: invalid-verify-after-prefix
title: VERIFY frame in the execution body
description: A VERIFY frame may not follow the validation prefix.
tags: [invalid, structure]
exercises: [PREFIX-050]
frames:
  - role: self_verify
    mode: VERIFY
    target: sender
    limits: { execution: 30000 }
  - role: execution
    mode: VERIFY
    target: "0x8943545177806ED17B9F23F0a21ee5948eCaa776"
    limits: { execution: 5000 }
expect:
  verdict: reject
  ruleIds: [PREFIX-050]
